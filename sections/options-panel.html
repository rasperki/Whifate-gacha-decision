<section class="lg:col-span-5 scrap-card p-5 md:p-6 space-y-5" aria-label="Pengaturan Pilihan">
  <div class="flex items-center justify-between gap-2 border-b border-dashed border-current/15 pb-3">
    <div>
      <h2 class="font-display text-lg font-bold">Daftar Pilihan</h2>
      <p id="deckQuestion" class="text-xs opacity-75">Masukkan minimal 2 opsi biar semesta bisa memilih.</p>
    </div>
    <span id="optionCountBadge" class="font-mono text-xs px-2.5 py-1 rounded-full bg-amber-200/80 text-stone-800 font-bold">
      0 opsi
    </span>
  </div>
  <div>
    <label for="presetSelect" class="block font-mono text-xs uppercase tracking-wider mb-1.5 opacity-75">
      Ganti Preset
    </label>
    <select id="presetSelect" class="whimsy-input w-full text-sm" aria-label="Pilih preset">
      <option value="">-- Pilih Preset --</option>
    </select>
  </div>
  <div class="setup-preview rounded-2xl border-2 border-dashed border-current/15 p-4">
    <div class="flex items-center gap-3">
      <span class="sticker-badge" aria-hidden="true">✦</span>
      <div class="min-w-0">
        <p class="font-mono text-[10px] uppercase tracking-widest opacity-65">Deck Aktif</p>
        <p id="hiddenDeckTitle" class="font-display text-lg font-bold break-words">Makan Apa Hari Ini?</p>
      </div>
    </div>
    <p id="hiddenDeckQuestion" class="mt-3 text-sm opacity-75">
      Daftar pilihan disembunyikan dari pemain.
    </p>
  </div>
  <div class="pt-3 border-t border-dashed border-current/15 flex flex-wrap items-center justify-between gap-2">
    <button id="shareLinkBtn" type="button" class="whimsy-btn whimsy-btn-accent text-xs sm:text-sm flex-1">
      🔗 Copy Share Link
    </button>
    <button id="adminPanelBtn" type="button" class="whimsy-btn whimsy-btn-ghost text-xs sm:text-sm">
      🔐 Admin
    </button>
  </div>
  <p id="shareStatus" class="font-mono text-xs text-emerald-600 dark:text-emerald-400 min-h-4"></p>
</section>
