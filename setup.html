<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengaturan Pilihan - Whimsy Fate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen transition-colors duration-300">
  <main class="max-w-3xl mx-auto px-4 py-6 md:py-10">
    <section class="scrap-card p-5 md:p-7 space-y-5" aria-label="Pengaturan daftar pilihan rahasia">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="font-mono text-xs uppercase tracking-widest opacity-65">Area Pengaturan</p>
          <h1 class="font-display text-2xl md:text-3xl font-bold">Atur Deck Pilihan</h1>
        </div>
        <a href="index.html" class="whimsy-btn whimsy-btn-ghost text-sm">← Kembali</a>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <select id="presetSelect" class="whimsy-input sm:col-span-2 text-sm" aria-label="Pilih preset">
          <option value="">-- Pilih Preset --</option>
        </select>
        <button id="newTopicBtn" type="button" class="whimsy-btn whimsy-btn-secondary text-sm">＋ Topik Baru</button>
      </div>

      <div class="flex items-center justify-between gap-3">
        <span class="font-mono text-xs uppercase tracking-wider opacity-75">Isi untuk mode</span>
        <div class="mode-switch" role="tablist" aria-label="Mode pengaturan topik">
          <button id="setupNormalBtn" type="button" class="mode-btn is-active" aria-selected="true">Normal</button>
          <button id="setupCrazyBtn" type="button" class="mode-btn" aria-selected="false">🔥 Crazy</button>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label for="deckTitleInput" class="block font-mono text-xs uppercase tracking-wider mb-1.5 opacity-75">Judul Pertanyaan / Topik</label>
          <input id="deckTitleInput" type="text" class="whimsy-input w-full font-semibold" placeholder="Contoh: Makan apa hari ini?" />
        </div>
        <div>
          <label for="deckQuestionInput" class="block font-mono text-xs uppercase tracking-wider mb-1.5 opacity-75">Deskripsi Singkat</label>
          <input id="deckQuestionInput" type="text" class="whimsy-input w-full text-sm" placeholder="Deskripsi deck..." />
        </div>
        <form id="addOptionForm" class="flex gap-2">
          <input id="optionInput" type="text" class="whimsy-input flex-1 text-sm" autocomplete="off" placeholder="Tulis pilihan baru..." />
          <button type="submit" class="whimsy-btn whimsy-btn-primary text-sm shrink-0">+ Tambah</button>
        </form>
      </div>

      <div class="flex items-center justify-between">
        <h2 class="font-display text-lg font-bold">Daftar Pilihan</h2>
        <div class="flex items-center gap-2">
          <span id="optionCountBadge" class="font-mono text-xs px-2.5 py-1 rounded-full bg-amber-200/80 text-stone-800 font-bold">0 opsi</span>
          <button id="saveDeckBtn" type="button" class="whimsy-btn whimsy-btn-primary text-sm">💾 Simpan & Pasang</button>
        </div>
      </div>
      <ul id="optionsList" class="space-y-2 max-h-72 overflow-y-auto pr-1" aria-label="Daftar Opsi"></ul>
      <p id="setupStatus" class="font-mono text-xs min-h-4" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
